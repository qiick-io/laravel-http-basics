name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/cache:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

  # Mutation targets from the design §8: one pest --mutate invocation per class
  # (pcov, no --covered-only, no || true), split round-robin across parallel
  # shards so no job runs near its timeout. Add a shard (and update
  # MUTATE_SHARDS) before one passes 20 minutes.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^10.0"
          composer require --no-interaction --no-update \
            "illuminate/cache:^12.0" \
            "illuminate/contracts:^12.0" \
            "illuminate/http:^12.0" \
            "illuminate/support:^12.0" \
            "illuminate/database:^12.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate (per-class min 95)
        env:
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 4
        run: |
          set -euo pipefail
          output="$(mktemp)"
          bash scripts/mutate-per-class.sh | tee "${output}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            awk '/^## Per-class mutation scores$/{flag=1} flag{print}' "${output}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  # One stable check name over every shard, for branch protection: it fails
  # unless every shard succeeded (a cancelled or skipped shard fails it too).
  mutation:
    name: Mutation (per-class ≥95%)
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutation-shards.result }}" = "success"

  # DatabaseIdempotencyStore on the four engines (checklist item 6 / M8).
  database-store-sqlite:
    name: DB store (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^10.0"
          composer require --no-interaction --no-update \
            "illuminate/cache:^12.0" \
            "illuminate/contracts:^12.0" \
            "illuminate/http:^12.0" \
            "illuminate/support:^12.0" \
            "illuminate/database:^12.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (database store)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/pest --filter=DatabaseIdempotency

  database-store:
    name: DB store (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pgsql
            image: postgres:16
            host_port: 5432
            container_port: 5432
            connection: pgsql
            username: httpbasics
            password: secret
            health: pg_isready -U httpbasics
          - engine: mysql
            image: mysql:8.4
            host_port: 3306
            container_port: 3306
            connection: mysql
            username: root
            password: secret
            health: mysqladmin ping -h 127.0.0.1 -uroot -psecret
          - engine: mariadb
            image: mariadb:11.4
            host_port: 3306
            container_port: 3306
            connection: mariadb
            username: root
            password: secret
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: httpbasics
          POSTGRES_DB: httpbasics
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: httpbasics
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: httpbasics
        ports:
          - ${{ matrix.host_port }}:${{ matrix.container_port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^10.0"
          composer require --no-interaction --no-update \
            "illuminate/cache:^12.0" \
            "illuminate/contracts:^12.0" \
            "illuminate/http:^12.0" \
            "illuminate/support:^12.0" \
            "illuminate/database:^12.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (database store)
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_DATABASE: httpbasics
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.host_port }}
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
        run: vendor/bin/pest --filter=DatabaseIdempotency

  # Real HTTP against php -S (middleware stack). Feature PRs fill the Pest group;
  # scaffold keeps the Laravel 12/13 cells so the matrix shape matches the fleet rule.
  http-server:
    name: Real HTTP (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/cache:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (real HTTP group)
        run: |
          set -euo pipefail
          junit="$(mktemp)"
          vendor/bin/pest --group=http-server --log-junit "${junit}"
          count="$(php -r '$xml = @simplexml_load_file($argv[1]); if ($xml === false) { fwrite(STDERR, "junit unreadable\n"); exit(2);} $tests = 0; foreach ($xml->xpath("//testsuite") ?: [] as $suite) { $tests = max($tests, (int) $suite["tests"]); } echo $tests;' "${junit}")"
          if [ "${count}" -eq 0 ]; then
            echo "::error::http-server Pest group is empty — real HTTP tests are required."
            exit 1
          fi
          echo "http-server junit tests=${count}"

  # no-dev cell: cache store must boot without illuminate/database (design §10).
  no-dev-cache:
    name: No-dev cache store boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install runtime dependencies only
        run: |
          composer update --no-interaction --prefer-dist --no-dev
          php -r 'require "vendor/autoload.php"; echo class_exists("Qiick\\HttpBasics\\Laravel\\HttpBasicsServiceProvider") ? "ok\n" : exit(1);'

  standards:
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
